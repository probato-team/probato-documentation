site_name: Docs
site_url: https://probato.org
repo_url: https://github.com/probato-team/probato
repo_name: probato-team/probato
remote_branch: main
docs_dir: src
site_dir: docs

copyright: "<p> Copyright &copy; 2024-<script>document.write(new Date().getFullYear())</script> Probato</p>"

theme:
  logo: assets/images/probato-logo.png
  favicon: assets/images/favicon.ico
  name: material
  icon:
    alternate: material/web
  font:
    text: Roboto
    code: Roboto Mono
  palette:

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      accent: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.top
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.footer
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - announce.dismiss

plugins:
  - search
  - i18n:
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: pt-BR
          name: Português (Brasil)
          build: true
          nav_translations:
            Home: Início
            About: Sobre
            Getting Started: Começando
            First steps: Primeiros passos
            Java Library: Biblioteca Java
            Web Application: Aplicação Web
            Examples: Exemplos
  - git-revision-date

nav:
  - Home: index.md
  - Getting Started:
      - First steps: first-steps.md
      - Java Library: library.md
      - Web Application: web-app.md
  - Examples: examples.md
  - About: about.md

extra:

  alternate:
    - name: English
      link: /
      lang: en
      icon: material/flag-outline
    - name: Português
      link: /pt-BR/
      lang: pt-BR
      icon: material/flag

  analytics:
    provider: google
    property: G-XZR907P520
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
          note: Thank you for your feedback!
        - icon: material/thumb-down-outline
          name: This page can be improved
          data: 0
          note: Thank you for your feedback!

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/probato-team/probato

extra_css:
  - assets/css/custom.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji
  # - pymdownx.superfences:
  #     custom_fences:
  #       - name: mermaid
  #         class: mermaid
  #         format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
