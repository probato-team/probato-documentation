site_name: Probato Framework
site_url: https://probato.org
repo_url: https://github.com/probato-team/probato
repo_name: probato-team/probato
remote_branch: main

docs_dir: src
site_dir: docs

copyright: >
  <p>Copyright &copy; 2024–
  <script>document.write(new Date().getFullYear())</script>
  Probato</p>

theme:
  name: material
  logo: assets/images/probato-logo.png
  favicon: assets/images/favicon.ico

  font:
    text: Roboto
    code: Roboto Mono

  icon:
    alternate: material/web

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      accent: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.top
    - navigation.expand
    - navigation.prune
    - navigation.footer
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - announce.dismiss

# ----------------------
# Navigation (EN default)
# ----------------------
nav:
  - Home:
      - Overview: index.md
      - Objective: home/objective.md
      - Conceptual Architecture: home/architecture.md
      - Features: home/features.md

  - Getting Started:
      - Introduction: getting-started/index.md
      - Environment Setup: getting-started/environment.md
      - Project Creation: getting-started/project-creation.md
      - First Execution: getting-started/first-execution.md

  - Concepts:
      - Overview: concepts/index.md
      - Test Suite: concepts/suite.md
      - Test Script: concepts/script.md
      - Procedure: concepts/procedure.md
      - Page Object: concepts/page-object.md
      - Dataset: concepts/dataset.md
      - Database: concepts/database.md

  - Guides:
      - Overview: guides/index.md
      - End-to-End Example: guides/end-to-end-example.md

  - Configuration:
      - Overview: configuration/index.md
      - Project Configuration: configuration/project.md
      - Browser Configuration: configuration/browser.md
      - Execution Settings: configuration/execution.md

  - Probato Manager:
      - Overview: manager/index.md

  - About:
      - About the Project: about/index.md

# ----------------------
# Plugins
# ----------------------
plugins:
  - search
  - git-revision-date
  - i18n:
      languages:
        - locale: en
          name: English
          default: true
          build: true
          site_name: Probato Framework

        - locale: pt-BR
          name: Português (Brasil)
          build: true
          site_name: Probato Framework
          nav_translations:
            Home: Início
            Overview: Visão Geral
            Objective: Objetivo
            Conceptual Architecture: Arquitetura Conceitual
            Features: Recursos

            Getting Started: Primeiros Passos
            Introduction: Introdução
            Environment Setup: Ambiente
            Project Creation: Criação do Projeto
            First Execution: Primeira Execução

            Concepts: Conceitos
            Test Suite: Suite de Testes
            Test Script: Script de Teste
            Procedure: Procedure
            Page Object: Page Object
            Dataset: Dataset
            Database: Database

            Guides: Guias
            End-to-End Example: Exemplo End-to-End

            Configuration: Configuração
            Project Configuration: Configuração do Projeto
            Browser Configuration: Configuração de Browser
            Execution Settings: Configurações de Execução

            Probato Manager: Probato Manager
            About: Sobre
            About the Project: Sobre o Projeto

# ----------------------
# Extra
# ----------------------
extra:
  alternate:
    - name: English
      link: /
      lang: en
      icon: material/flag-outline

    - name: Português
      link: /pt-BR/
      lang: pt-BR
      icon: material/flag

  analytics:
    provider: google
    property: G-XZR907P520

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/probato-team/probato

    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@probato

extra_css:
  - assets/css/custom.css
  - assets/css/extra.css

markdown_extensions:
  - admonition
  - def_list
  - attr_list
  - md_in_html

  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji

  - pymdownx.tasklist:
      custom_checkbox: true
